services:
  impact-api:
    build: .
    command: ["impact-engine-local-api", "--host", "127.0.0.1", "--port", "8001", "--default-project", "/workspace/project"]
    expose:
      - "8001"
    volumes:
      - impact_state:/app/.impact_engine
      - ${IMPACT_PROJECT_PATH:-.}:/workspace/project:ro

  registry-api:
    build: .
    command: ["impact-engine-registry-api"]
    expose:
      - "8787"
    volumes:
      - impact_state:/app/.impact_engine

volumes:
  impact_state:
