openapi: 3.0.3
info:
  title: Boundary Fixture
  version: 1.0.0
paths:
  /users/{id}:
    get:
      operationId: getUser
      tags: [users]
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
  /users:
    post:
      operationId: createUser
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserInput'
      responses:
        '201':
          description: created
components:
  parameters:
    UserId:
      name: id
      in: path
      required: true
      schema:
        type: string
  schemas:
    User:
      type: object
      properties:
        id: {type: string}
        address:
          $ref: '#/components/schemas/Address'
    Address:
      type: object
      properties:
        city: {type: string}
    UserInput:
      type: object
