name: Release verification

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  release-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Create clean virtual environment
        run: python -m venv .venv
      - name: Install validation dependencies
        run: .venv/bin/python -m pip install ".[dev]" build
      - name: Verify packaged agent skills are synchronized
        run: .venv/bin/python scripts/sync_agent_skills.py
      - name: Run regression suite
        run: .venv/bin/python -m pytest -q
      - name: Build wheel and run isolated UI/plugin E2E
        run: .venv/bin/python scripts/check_wheel_e2e.py

  browser-e2e:
    runs-on: ubuntu-latest
    env:
      IMPACT_ENGINE_REQUIRE_BROWSER_E2E: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install browser-test dependencies
        run: python -m pip install ".[dev,browser]"
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Run browser E2E
        run: python -m pytest tests/test_frontend_browser_e2e.py -q -rs

  agent-lsp-real-e2e:
    runs-on: ubuntu-latest
    env:
      IMPACT_AGENT_LSP_REAL_E2E: "1"
      IMPACT_AGENT_LSP_E2E_REPORT: artifacts/agent-lsp-real-e2e.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install real language servers and official Agent-LSP
        run: |
          sudo apt-get update
          sudo apt-get install -y clangd
          npm install -g pyright@1.1.411 typescript@5.9.3 typescript-language-server@5.1.3
          go install github.com/blackwell-systems/agent-lsp/cmd/agent-lsp@v0.16.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Install CodeSlicer test dependencies
        run: python -m pip install ".[dev]" mypy==1.7.1 psutil
      - name: Run persistent Agent-LSP real-server E2E
        run: python -m pytest tests/test_agent_lsp_runtime_real.py -q -rs
      - name: Upload real Agent-LSP evidence
        uses: actions/upload-artifact@v4
        with:
          name: agent-lsp-real-e2e
          path: artifacts/agent-lsp-real-e2e.json
          if-no-files-found: error

  canonical-invariance:
    runs-on: ubuntu-latest
    env:
      IMPACT_AGENT_LSP_CANONICAL_REPORT: artifacts/canonical-invariance.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CodeSlicer test dependencies
        run: python -m pip install ".[dev]"
      - name: Verify canonical graph invariance
        run: python -m pytest tests/test_agent_lsp_canonical_invariance.py -q
      - name: Upload canonical invariance evidence
        uses: actions/upload-artifact@v4
        with:
          name: canonical-invariance
          path: artifacts/canonical-invariance.json
          if-no-files-found: error
